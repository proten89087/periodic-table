<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Периодическая система элементов Менделеева</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #060709; color: #fff; height: 100vh;
            display: flex; flex-direction: column; justify-content: flex-start;
            align-items: center; overflow: hidden; padding: 4px; position: relative;
        }
        #particles-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        h1 { font-size: 0.9rem; margin-bottom: 2px; font-weight: 700; letter-spacing: 1px; color: #a0aec0; text-transform: uppercase; z-index: 10; text-align: center; }
        .search-container { z-index: 10; margin-bottom: 4px; width: 100%; max-width: 260px; }
        .search-input {
            width: 100%; padding: 5px 10px; background: rgba(22, 23, 26, 0.9);
            border: 2px solid #2d3748; border-radius: 6px; color: #fff; font-size: 0.8rem;
            outline: none; transition: all 0.3s; text-align: center; font-weight: 600;
        }
        .search-input:focus { border-color: #00b462; box-shadow: 0 0 10px rgba(0, 180, 98, 0.4); }
        .table-wrapper { width: 100%; height: calc(100vh - 55px); z-index: 2; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .periodic-table {
            display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); grid-template-rows: repeat(10, minmax(0, 1fr)); 
            gap: 2px; width: 100%; height: 100%; max-width: 100vw; max-height: 100vh;
            background: rgba(10, 12, 18, 0.9); backdrop-filter: blur(10px); padding: 4px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .element {
            background: #16171a; border: 1px solid currentColor; border-radius: 2px;
            padding: 1px; display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; cursor: pointer; position: relative; user-select: none; transition: transform 0.2s, opacity 0.3s;
        }
        .element.fade-out { opacity: 0.12; filter: grayscale(0.7); }
        .element:hover { transform: scale(1.15); z-index: 100; box-shadow: 0 0 8px currentColor; background: #202226; }
        
        /* Шрифты сетки */
        .element .num { font-size: 0.55vw; align-self: flex-start; font-weight: 700; color: rgba(255, 255, 255, 0.35); line-height: 1; }
        .element .symbol { font-size: 1.1vw; font-weight: 800; text-align: center; line-height: 1; }
        .element .name { font-size: 0.45vw; font-weight: 900; color: #fff; text-align: center; text-transform: uppercase; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1; }
        .element .mass { font-size: 0.48vw; text-align: center; line-height: 1; color: rgba(255, 255, 255, 0.5); }
        
        .s-element { color: #b6be5d; } .p-element { color: #00b462; } .d-element { color: #ff5c5c; } .f-element { color: #b380a0; } .unknown-element { color: #a0aec0; }
        
        /* АДАПТИВНОЕ МОДАЛЬНОЕ ОКНО С ПОДДЕРЖКОЙ СКРОЛЛА КОНТЕНТА */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center; z-index: 99999; backdrop-filter: blur(4px);
        }
        .modal-card {
            background: #140d12; border: 3px solid #fff; border-radius: 12px; width: 290px; height: 290px; padding: 15px;
            display: flex; flex-direction: column; justify-content: space-between; position: relative; color: #fff; overflow-y: auto; overflow-x: hidden;
        }
        .modal-card .num { font-size: 1.1rem; font-weight: 700; color: rgba(255,255,255,0.5); }
        .modal-card .symbol { font-size: 3.2rem; font-weight: 800; line-height: 0.85; }
        .modal-card .name { font-size: 1.4rem; font-weight: 800; margin-top: 2px; }
        .modal-card .mass { font-size: 1.1rem; font-weight: 700; border-bottom: 2px solid rgba(255,255,255,0.2); width: 50%; padding-bottom: 2px; margin-bottom: 5px; }
        
        .modal-card .extra-info { display: flex; flex-direction: column; gap: 2px; font-size: 0.8rem; font-weight: 700; z-index: 5; margin-top: auto; }
        .modal-card .extra-info div { display: flex; justify-content: space-between; width: 100%; max-width: 200px; }
        .modal-card .extra-info span:first-child { color: rgba(255,255,255,0.4); }
        .modal-card .extra-info span:last-child { color: #fff; }
        
        .modal-card .shells-vertical { position: absolute; right: 15px; top: 15px; display: flex; flex-direction: column; gap: 3px; font-size: 1.1rem; font-weight: 800; text-align: right; z-index: 10; }
        .modal-card .rings-container { position: absolute; top: 50%; left: 50%; width: 95%; height: 95%; transform: translate(-50%, -50%); pointer-events: none; z-index: 1; }
        .modal-orbit { position: absolute; top: 50%; left: 50%; border: 1px solid rgba(255,255,255,0.08); border-radius: 50%; transform: translate(-50%, -50%); animation: spinRing linear infinite; }
        
        /* Стили точек-электронов на кольцах */
        .modal-electron { position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%; box-shadow: 0 0 6px #fff, 0 0 8px currentColor; transform: translate(-50%, -50%); }
        @keyframes spinRing { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>

                col: parseInt(parts[5]), row: parseInt(parts[6]),
                shells: parts[7].split(',').map(n => parseInt(n)),
                density: parts[8], melt: parts[9], boil: parts[10]
            };
        });

        const container = document.getElementById('table-container');
        const searchInput = document.getElementById('search');
        const modal = document.getElementById('modal');
        const modalCard = document.getElementById('modal-card');

        // Функция вывода сетки таблицы
        function renderElements(filter = '') {
            container.innerHTML = '';
            const lowerFilter = filter.toLowerCase().trim();
            elementsData.forEach(el => {
                const isMatch = !filter || el.name.toLowerCase().includes(lowerFilter) || el.sym.toLowerCase().includes(lowerFilter) || el.num.toString() === lowerFilter;
                const div = document.createElement('div');
                div.className = `element ${el.type}-element ${!isMatch && filter ? 'fade-out' : ''}`;
                div.style.gridColumn = el.col; div.style.gridRow = el.row;
                div.innerHTML = `<span class="num">${el.num}</span><span class="symbol">${el.sym}</span><span class="name">${el.name}</span><span class="mass">${el.mass}</span>`;
                div.addEventListener('click', () => openModal(el));
                container.appendChild(div);
            });
        }

        // Функция открытия карточки с честным подсчетом электронов и колец
        function openModal(el) {
            document.getElementById('m-num').innerText = el.num;
            document.getElementById('m-sym').innerText = el.sym;
            document.getElementById('m-name').innerText = el.name;
            document.getElementById('m-mass').innerText = el.mass;
            document.getElementById('m-density').innerText = el.density + (el.density !== "—" && !el.density.includes("°") ? " г/см³" : "");
            document.getElementById('m-melt').innerText = el.melt;
            document.getElementById('m-boil').innerText = el.boil;
            
            // Правый вертикальный список цифр электронов
            document.getElementById('m-shells').innerHTML = el.shells.map(s => `<div>${s}</div>`).join('');
            
            const ringsContainer = document.getElementById('m-rings');
            ringsContainer.innerHTML = '';
            
            // Динамическая генерация колец и точек строго по массиву shells
            el.shells.forEach((count, idx) => {
                if(isNaN(count) || count === 0) return;
                
                // Рассчитываем диаметр кольца
                const size = (idx + 1) * 26 + 45;
                const orbit = document.createElement('div');
                orbit.className = 'modal-orbit';
                orbit.style.width = size + 'px'; orbit.style.height = size + 'px';
                // Плавная скорость вращения каждого уровня
                orbit.style.animationDuration = (5 + idx * 2.5) + 's';
                
                // Раскладываем точки-электроны равномерно по кругу (360 градусов)
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * 2 * Math.PI;
                    const r = size / 2;
                    // Вычисляем точные координаты X и Y для каждой точки на окружности
                    const x = r + r * Math.cos(angle);
                    const y = r + r * Math.sin(angle);
                    
                    const electron = document.createElement('div');
                    electron.className = 'modal-electron';
                    electron.style.left = x + 'px';
                    electron.style.top = y + 'px';
                    orbit.appendChild(electron);
                }
                ringsContainer.appendChild(orbit);
            });
            
            const familyColor = window.getComputedStyle(document.querySelector(`.${el.type}-element`)).color;
            modalCard.style.borderColor = familyColor;
            modalCard.style.boxShadow = `0 20px 50px rgba(0,0,0,0.85), 0 0 30px ${familyColor}`;
            modal.style.display = 'flex';
        }

        // Логика управления окном и поиском
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
        searchInput.addEventListener('input', (e) => renderElements(e.target.value));
        renderElements();

        // Анимация частиц заднего фона Canvas
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        for (let i = 0; i < 20; i++) {
            particles.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                radius: Math.random() * 1.2 + 0.4, vx: (Math.random() - 0.5) * 0.2, vy: (Math.random() - 0.5) * 0.2, alpha: Math.random() * 0.4 + 0.1
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 180, 98, ${p.alpha})`; ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
