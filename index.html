<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Периодическая система элементов Менделеева</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #060709; color: #fff; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; overflow-x: hidden; padding: 1vw; position: relative;
        }
        #particles-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        h1 {
            font-size: 1.4rem; margin-bottom: 8px; font-weight: 400; letter-spacing: 4px;
            color: #a0aec0; text-transform: uppercase; text-shadow: 0 0 10px rgba(0, 180, 98, 0.3); z-index: 10;
            text-align: center;
        }
        .search-container { z-index: 10; margin-bottom: 12px; width: 100%; max-width: 400px; position: relative; padding: 0 10px; }
        .search-input {
            width: 100%; padding: 10px 15px; background: rgba(22, 23, 26, 0.9);
            border: 2px solid #2d3748; border-radius: 8px; color: #fff; font-size: 1rem;
            outline: none; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center;
        }
        .search-input:focus { border-color: #00b462; box-shadow: 0 0 15px rgba(0, 180, 98, 0.4); }
        
        .table-wrapper {
            width: 100%; max-width: 1600px; overflow-x: auto; padding: 20px 10px; z-index: 2;
            -webkit-overflow-scrolling: touch;
        }
        
        .periodic-table {
            display: grid; grid-template-columns: repeat(18, minmax(45px, 1fr));
            grid-template-rows: repeat(10, minmax(48px, 1fr)); gap: 8px;
            width: 100%; min-width: 950px; height: 78vh; max-height: 800px;
            background: rgba(10, 12, 18, 0.9); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,0.95);
            border: 1px solid rgba(255, 255, 255, 0.02); position: relative;
        }
        .element {
            background: #16171a; border: 2px solid currentColor; border-radius: 4px;
            padding: 5px; display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; cursor: pointer; position: relative; user-select: none;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s, opacity 0.3s, filter 0.3s;
        }
        .element.fade-out { opacity: 0.15; filter: grayscale(80%) !important; pointer-events: none; }
        .element:hover:not(.active) { transform: scale(1.2); z-index: 10; box-shadow: 0 0 15px currentColor; }
        
        .element .num { font-size: 0.75rem; align-self: flex-start; font-weight: bold; line-height: 1; }
        .element .symbol { font-size: 1.4rem; font-weight: bold; text-align: center; line-height: 1; text-shadow: 0 0 8px currentColor; }
        .element .name { font-size: 0.55rem; text-align: center; color: rgba(255, 255, 255, 0.7); font-weight: 500; }
        .element .mass { font-size: 0.65rem; text-align: center; line-height: 1; color: rgba(255, 255, 255, 0.8); }
        .element .shells-list, .element .extended-info, .element .orbit-container { display: none; }

        .s-element { color: #b6be5d; } .p-element { color: #00b462; }
        .d-element { color: #ff5c5c; } .f-element { color: #b380a0; } .unknown-element { color: #a0aec0; }

        .element.active {
            transform: scale(5.5) !important; z-index: 999999 !important; 
            box-shadow: 0 30px 70px rgba(0,0,0,0.95), 0 0 45px currentColor !important; 
            border: 3px solid currentColor !important; padding: 6px 8px; 
            display: flex; flex-direction: column; justify-content: flex-start;
            opacity: 1 !important; filter: none !important; color: #fff !important;
        }

        .element.active.s-element { background: #1c200c !important; }
        .element.active.p-element { background: #042410 !important; }
        .element.active.d-element { background: #2b0b0b !important; }
        .element.active.f-element { background: #260d21 !important; }
        .element.active.unknown-element { background: #171c24 !important; }
        
        .element.active .num { font-size: 0.32rem; align-self: flex-start; color: #fff !important; opacity: 1 !important; }
        .element.active .symbol { font-size: 0.95rem; margin-top: 1px; text-align: left; align-self: flex-start; color: #fff !important; text-shadow: 0 0 15px currentColor !important; opacity: 1 !important; }
        .element.active .name { display: block; font-size: 0.34rem; text-align: left; color: #fff !important; font-weight: bold; align-self: flex-start; margin-bottom: 2px; opacity: 1 !important; }
        .element.active .mass { font-size: 0.34rem; font-weight: bold; text-align: left; align-self: flex-start; width: 100%; border-top: 1px solid rgba(255,255,255,0.25); padding-top: 2px; margin-top: 1px; color: #fff !important; opacity: 1 !important; }
        .element.active .shells-list { display: flex; flex-direction: column; position: absolute; right: 8px; top: 8px; font-size: 0.32rem; font-weight: bold; color: #fff !important; text-align: right; line-height: 1.1; z-index: 110; opacity: 1 !important; }
        .element.active .extended-info { display: flex; flex-direction: column; gap: 1px; font-size: 0.23rem; color: #fff !important; text-align: left; width: 100%; margin-top: 2px; opacity: 1 !important; }
        .extended-info div { display: flex; justify-content: space-between; line-height: 1; color: #fff !important; }
        .extended-info span { color: rgba(255,255,255,0.6) !important; font-weight: 600; }
        .element.active .orbit-container { display: block; position: absolute; top: 50%; left: 50%; width: 92%; height: 92%; transform: translate(-50%, -50%); pointer-events: none; z-index: 1; opacity: 0.55; filter: none !important; }
        
        .orbit { position: absolute; top: 50%; left: 50%; border: 1px solid currentColor; border-radius: 50%; transform: translate(-50%, -50%); animation: spin linear infinite; }
        .electron-dot { position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%; box-shadow: 0 0 6px #fff, 0 0 10px currentColor; transform: translate(-50%, -50%); }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        @media (max-width: 768px) {
            h1 { font-size: 1.1rem; margin-top: 10px; }
            .search-input { font-size: 0.9rem; padding: 8px 12px; }
            .element.active {
                position: fixed !important; top: 50% !important; left: 50% !important;
                transform: translate(-50%, -50%) scale(1) !important; width: 85vw !important;
                max-width: 320px !important; height: 340px !important; grid-column: auto !important;
                grid-row: auto !important; padding: 20px !important; border-radius: 12px !important;
                box-shadow: 0 0 60px rgba(0,0,0,0.95), 0 0 35px currentColor !important;
            }
            .element.active .num { font-size: 1rem !important; }
            .element.active .symbol { font-size: 3rem !important; margin-top: 5px !important; }
            .element.active .name { font-size: 1.2rem !important; margin-bottom: 10px !important; }
            .element.active .mass { font-size: 1.1rem !important; padding-top: 8px !important; margin-top: 5px !important; }
            .element.active .shells-list { font-size: 0.9rem !important; right: 15px !important; top: 15px !important; line-height: 1.3 !important; }
            .element.active .extended-info { font-size: 0.85rem !important; gap: 5px !important; margin-top: 10px !important; }
            .element.active .extended-info div { line-height: 1.3 !important; }
        }
    </style>
</head>

            el.shells = calculateShells(parseInt(el.num));

            const cell = document.createElement('div');
            cell.className = `element ${el.category}`;
            cell.style.gridColumn = el.col; cell.style.gridRow = el.row;
            cell.setAttribute('data-name', el.name.toLowerCase());
            cell.setAttribute('data-symbol', el.symbol.toLowerCase());
            cell.setAttribute('data-num', el.num);

            cell.innerHTML = `
                <div class="num">${el.num}</div>
                <div class="shells-list">${el.shells.join('<br>')}</div>
                <div class="symbol">${el.symbol}</div>
                <div class="name">${el.name}</div>
                <div class="mass">${el.mass}</div>
                <div class="extended-info">
                    <div><span>Плотн:</span> ${el.density}</div>
                    <div><span>Плавл:</span> ${el.melt}</div>
                    <div><span>Кип:</span> ${el.boil}</div>
                </div>
                <div class="orbit-container"></div>
            `;

            cell.onclick = (e) => {
                e.stopPropagation();
                const currentActive = document.querySelector('.element.active');
                if (currentActive) {
                    currentActive.classList.remove('active');
                    currentActive.querySelector('.orbit-container').innerHTML = '';
                }
                cell.classList.add('active');

                const container = cell.querySelector('.orbit-container');
                container.innerHTML = '';
                const totalShells = el.shells.length;

                el.shells.forEach((electronsCount, index) => {
                    const orbit = document.createElement('div');
                    orbit.className = 'orbit';
                    const sizePercent = 30 + ((index + 1) / totalShells) * 65;
                    orbit.style.width = `${sizePercent}%`; orbit.style.height = `${sizePercent}%`;
                    orbit.style.animationDuration = `${6 + index * 3}s`;
                    if (index % 2 === 1) orbit.style.animationDirection = 'reverse';

                    for (let i = 0; i < electronsCount; i++) {
                        const dot = document.createElement('div');
                        dot.className = 'electron-dot';
                        const angle = (i * 2 * Math.PI) / electronsCount;
                        dot.style.left = `${50 + 50 * Math.cos(angle)}%`;
                        dot.style.top = `${50 + 50 * Math.sin(angle)}%`;
                        orbit.appendChild(dot);
                    }
                    container.appendChild(orbit);
                });
            };
            table.appendChild(cell);
        });

        const searchInput = document.getElementById('search');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            document.querySelectorAll('.element').forEach(cell => {
                if (query === "") { cell.classList.remove('fade-out'); }
                else if (cell.getAttribute('data-name').includes(query) || cell.getAttribute('data-symbol').includes(query) || cell.getAttribute('data-num') === query) {
                    cell.classList.remove('fade-out');
                } else { cell.classList.add('fade-out'); }
            });
        });

        window.onclick = () => {
            const currentActive = document.querySelector('.element.active');
            if (currentActive) { currentActive.classList.remove('active'); currentActive.querySelector('.orbit-container').innerHTML = ''; }
        };

        const canvas = document.getElementById('particles-canvas'); const ctx = canvas.getContext('2d');
        let particles = []; function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5; this.vx = (Math.random() - 0.5) * 0.2; this.vy = (Math.random() - 0.5) * 0.2;
                this.hue = Math.random() > 0.5 ? 145 : 0;
            }
            update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > canvas.width) this.vx *= -1; if (this.y < 0 || this.y > canvas.height) this.vy *= -1; }
            draw() {
                ctx.fillStyle = `hsla(${this.hue}, 85%, 55%, 0.12)`; ctx.shadowBlur = 6; ctx.shadowColor = `hsl(${this.hue}, 85%, 55%)`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
            }
        }
        for (let i = 0; i < 40; i++) particles.push(new Particle());
        function loop() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
