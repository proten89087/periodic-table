<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Периодическая система элементов Менделеева</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #060709; color: #fff; height: 100vh;
            display: flex; flex-direction: column; justify-content: flex-start;
            align-items: center; overflow: hidden; padding: 4px; position: relative;
        }
        #particles-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        h1 {
            font-size: 0.9rem; margin-bottom: 2px; font-weight: 700; letter-spacing: 1px;
            color: #a0aec0; text-transform: uppercase; z-index: 10; text-align: center;
        }
        .search-container { z-index: 10; margin-bottom: 4px; width: 100%; max-width: 260px; }
        .search-input {
            width: 100%; padding: 5px 10px; background: rgba(22, 23, 26, 0.9);
            border: 2px solid #2d3748; border-radius: 6px; color: #fff; font-size: 0.8rem;
            outline: none; transition: all 0.3s; text-align: center; font-weight: 600;
        }
        .search-input:focus { border-color: #00b462; box-shadow: 0 0 10px rgba(0, 180, 98, 0.4); }
        .table-wrapper {
            width: 100%; height: calc(100vh - 55px); z-index: 2; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .periodic-table {
            display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); grid-template-rows: repeat(10, minmax(0, 1fr)); 
            gap: 2px; width: 100%; height: 100%; max-width: 100vw; max-height: 100vh;
            background: rgba(10, 12, 18, 0.9); backdrop-filter: blur(10px);
            padding: 4px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .element {
            background: #16171a; border: 1px solid currentColor; border-radius: 2px;
            padding: 1px; display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; cursor: pointer; position: relative; user-select: none; transition: transform 0.2s, opacity 0.3s;
        }
        .element.fade-out { opacity: 0.12; filter: grayscale(0.7); }
        .element:hover { transform: scale(1.15); z-index: 100; box-shadow: 0 0 8px currentColor; background: #202226; }
        .element .num { font-size: 0.55vw; align-self: flex-start; font-weight: 700; color: rgba(255, 255, 255, 0.35); line-height: 1; }
        .element .symbol { font-size: 1.1vw; font-weight: 800; text-align: center; line-height: 1; }
        .element .name { font-size: 0.45vw; font-weight: 900; color: #fff; text-align: center; text-transform: uppercase; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1; }
        .element .mass { font-size: 0.48vw; text-align: center; line-height: 1; color: rgba(255, 255, 255, 0.5); }
        .s-element { color: #b6be5d; } .p-element { color: #00b462; } .d-element { color: #ff5c5c; } .f-element { color: #b380a0; } .unknown-element { color: #a0aec0; }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center; z-index: 99999; backdrop-filter: blur(4px);
        }
        .modal-card {
            background: #140d12; border: 3px solid #fff; border-radius: 12px; width: 270px; height: 270px; padding: 12px;
            display: flex; flex-direction: column; justify-content: space-between; position: relative; color: #fff; overflow: hidden;
        }
        .modal-card .num { font-size: 1rem; font-weight: 700; color: rgba(255,255,255,0.5); }
        .modal-card .symbol { font-size: 3rem; font-weight: 800; line-height: 0.85; }
        .modal-card .name { font-size: 1.2rem; font-weight: 800; margin-top: 2px; }
        .modal-card .mass { font-size: 1rem; font-weight: 700; border-bottom: 2px solid rgba(255,255,255,0.2); width: 50%; padding-bottom: 2px; }
        .modal-card .extra-info { display: flex; flex-direction: column; gap: 2px; font-size: 0.75rem; font-weight: 700; z-index: 5; }
        .modal-card .extra-info div { display: flex; gap: 6px; }
        .modal-card .extra-info span { color: rgba(255,255,255,0.4); }
        .modal-card .shells-vertical { position: absolute; right: 15px; top: 15px; display: flex; flex-direction: column; gap: 3px; font-size: 1rem; font-weight: 800; text-align: right; z-index: 10; }
        .modal-card .rings-container { position: absolute; top: 50%; left: 50%; width: 90%; height: 90%; transform: translate(-50%, -50%); pointer-events: none; z-index: 1; }
        .modal-orbit { position: absolute; top: 50%; left: 50%; border: 1.5px solid rgba(255,255,255,0.1); border-radius: 50%; transform: translate(-50%, -50%); animation: spinRing linear infinite; }
        .modal-electron { position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%; box-shadow: 0 0 6px #fff, 0 0 10px currentColor; transform: translate(-50%, -50%); }
        @keyframes spinRing { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
