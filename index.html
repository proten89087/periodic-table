<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Периодическая система элементов Менделеева</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <h1>Периодическая система Менделеева</h1>
    <div class="search-container">
        <input type="text" id="search" class="search-input" placeholder="Поиск элементов...">
    </div>
    <div class="table-wrapper">
        <div class="periodic-table" id="table-container"></div>
    </div>
    <div class="modal-overlay" id="modal">
        <div class="modal-card" id="modal-card">
            <div>
                <div class="num" id="m-num"></div>
                <div class="symbol" id="m-sym"></div>
                <div class="name" id="m-name"></div>
                <div class="mass" id="m-mass"></div>
            </div>
            <div class="extra-info">
                <div><span>Плотн:</span><span id="m-density"></span></div>
                <div><span>Плавл:</span><span id="m-melt"></span></div>
                <div><span>Кип:</span><span id="m-boil"></span></div>
            </div>
            <div class="shells-vertical" id="m-shells"></div>
            <div class="rings-container" id="m-rings"></div>
        </div>
    </div>
    <script src="database.js"></script>
    <script src="main.js"></script>
</body>
</html>
